# ==============================================================================
# TEKNOFEST 2026 - ANKAAI
# Sinif ID Esleme Konfigurasyonu (Class ID Mapping Configuration)
# ==============================================================================
# Bu dosya, farkli veri setlerinden gelen eski sinif ID'lerini
# projenin standart sinif ID'lerine donusturmek icin kullanilir.
#
# KURALLAR:
#   - Tum etiketler ASCII-safe ve kucuk harfli olmalidir.
#   - Turkce karakter KULLANILAMAZ (c, g, i, o, s, u yerine ç, ğ, ı, ö, ş, ü degil).
#   - confidence_score anahtari disinda farkli isim KULLANILAMAZ.
# ==============================================================================

# Projenin standart sinif listesi (index = YOLO class ID)
# Her sinifin indexi, YOLO .txt etiket dosyalarindaki class ID'yi belirler.
standard_classes:
  # --- Arac Tipleri (0-6) ---
  0: "sedan"
  1: "suv"
  2: "hatchback"
  3: "pickup"
  4: "minibus"
  5: "panelvan"
  6: "kamyon"

  # --- Sofor Eylemleri (7-14) ---
  7: "arkaya_bakma"
  8: "esneme"
  9: "sigara_icme"
  10: "su_icme"
  11: "telefonla_konusma"
  12: "slalom"
  13: "etrafa_bakinma"
  14: "emniyet_kemeri_ihlali"

  # --- Nesneler (15-16) ---
  15: "teknocan"
  16: "bilgisayar"

  # --- Yolcular (17-19) ---
  17: "arka_koltuk_1"
  18: "arka_koltuk_2"
  19: "on_koltuk"

  # --- Plaka (20) ---
  20: "plaka"

# Sinif -> Kategori esleme tablosu (JSON ciktisindaki "kategori" alani)
class_to_category:
  sedan: "arac_tipi"
  suv: "arac_tipi"
  hatchback: "arac_tipi"
  pickup: "arac_tipi"
  minibus: "arac_tipi"
  panelvan: "arac_tipi"
  kamyon: "arac_tipi"
  arkaya_bakma: "sofor_eylemi"
  esneme: "sofor_eylemi"
  sigara_icme: "sofor_eylemi"
  su_icme: "sofor_eylemi"
  telefonla_konusma: "sofor_eylemi"
  slalom: "sofor_eylemi"
  etrafa_bakinma: "sofor_eylemi"
  emniyet_kemeri_ihlali: "sofor_eylemi"
  teknocan: "nesneler"
  bilgisayar: "nesneler"
  arka_koltuk_1: "yolcular"
  arka_koltuk_2: "yolcular"
  on_koltuk: "yolcular"
  plaka: "plaka"

# Gecerli arac renkleri (JSON ciktisindaki "renk" alani)
valid_colors:
  - "beyaz"
  - "siyah"
  - "gri"
  - "kirmizi"
  - "mavi"
  - "sari"
  - "yesil"
  - "turuncu"
  - "kahverengi"

# ==============================================================================
# VERI SETI KAYNAKLARINA GORE SINIF ID ESLEME (SOURCE MAPPINGS)
# ==============================================================================
# Her kaynak icin:  eski_id -> yeni_standart_id
# Yeni veri seti eklediginizde buraya bir blok ekleyin.
# ==============================================================================

source_mappings:
  # --- Cars_Body_Type (klasor bazli siniflandirma → YOLO detection) ---
  # Coupe ve Convertible kilavuzda tanimli degil, sedan altinda birlestirild.
  cars_body_type:
    Sedan: 0        # sedan
    SUV: 1          # suv
    Hatchback: 2    # hatchback
    "Pick-Up": 3    # pickup
    VAN: 5          # panelvan
    Coupe: 0        # sedan (kilavuzda coupe yok)
    Convertible: 0  # sedan (kilavuzda convertible yok)

  # --- vehicles.v2-release (Roboflow RF100) ---
  # Sadece small/big bus ve small/big truck kullanildi.
  # Diger siniflar (car, mid truck, bus-l-, bus-s-, truck-l/m/s/xl) atildi.
  vehicles_v2:
    0: 4    # "big bus"     -> minibus
    1: 6    # "big truck"   -> kamyon
    6: 4    # "small bus"   -> minibus
    7: 6    # "small truck" -> kamyon

  # --- plateRecognition (YOLO detection, tek sinif) ---
  plate_recognition:
    0: 20   # "plaka" -> plaka (Class 20)

  # --- colorRecognition (YOLO classification, 9 gecerli renk) ---
  # pink ve purple kilavuzda tanimli degil, cikarildi.
  # silver->gri, tan/beige->kahverengi, gold->sari olarak birlestirildi.
  color_recognition:
    black: "siyah"
    white: "beyaz"
    grey: "gri"
    silver: "gri"
    red: "kirmizi"
    blue: "mavi"
    yellow: "sari"
    gold: "sari"
    green: "yesil"
    orange: "turuncu"
    brown: "kahverengi"
    tan: "kahverengi"
    beige: "kahverengi"

  # --- Yeni kaynak eklemek icin bu sablonu kullanin ---
  # yeni_kaynak_adi:
  #   eski_id: yeni_standart_id
  #   0: 0
  #   1: 7

  # --- gelismisSurucuİzlemeSD (YOLO detection) ---
  # yawn(0)->esneme(8), seatbelt(2)->emniyet_kemeri_ihlali(14), mobile(3)->telefonla_konusma(11)
  # eyesclosed(1) kilavuzda tanimli degil, cikarildi.
  gelismis_surucu:
    0: 8
    2: 14
    3: 11

  # --- dmd (YOLO detection) ---
  # Cigarette(2)->sigara_icme(9), Phone(3)->telefonla_konusma(11), Seatbelt(4)->emniyet_kemeri_ihlali(14)
  # Open Eye(0) ve Closed Eye(1) kilavuzda tanimli degil, cikarildi.
  dmd_dataset:
    2: 9
    3: 11
    4: 14

  # --- Driver Behavior Image Dataset (Klasor bazli siniflandirma → YOLO detection) ---
  # safe_driving ve other_activities kilavuzda tanimli degil, cikarildi.
  driver_behavior:
    talking_phone: 11
    texting_phone: 11
    turning: 7

